<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<!-- assets.js 按页面地址拼 assets/…，自测页在 tests/ 下，用 base 把相对路径指回站点根目录 -->
<base href="../">
<title>home 自测</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #gl { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #log { position: fixed; left: 50%; top: 0; transform: translateX(-50%); max-width: 70%; max-height: 30%; overflow: auto; z-index: 999;
         font: 11px/1.35 monospace; color: #ff8; background: rgba(120,0,0,.75); white-space: pre-wrap; pointer-events: none; }
  #log:empty { display: none; }
</style>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="log"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/BufferGeometryUtils.js"></script>
<script src="js/core/base.js"></script>
<script src="js/core/assets.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/gfx.js"></script>
<script src="js/core/input.js"></script>
<script src="js/levels/Ldev.js"></script>
<script src="js/game/skin.js"></script>
<script src="js/ui/home.js"></script>
<script>
// 主页自测：用 http 打开（file:// 下 GLB 和贴图都会走兜底）。
// ?open=menu|casual|nightmare|test|credits|skin 直接打开对应弹层，方便截图；?skin=red 预设颜色
// 页面顶部只显示错误；?log=all 连 info/warn 一起显示
(function () {
'use strict';
const BR = window.BR;
const q = new URLSearchParams(location.search);
const logEl = document.getElementById('log');
const showAll = q.get('log') === 'all';
function log(level, args) {
  if (level === 'error' || level === 'uncaught' || showAll) logEl.textContent += '[' + level + '] ' + args.join(' ') + '\n';
}
['error', 'warn', 'info', 'log'].forEach(k => {
  const orig = console[k].bind(console);
  console[k] = function () { log(k, Array.from(arguments).map(String)); orig.apply(null, arguments); };
});
window.addEventListener('error', e => log('uncaught', [e.message, e.filename + ':' + e.lineno]));

const canvas = document.getElementById('gl');
BR.gfx.init(canvas);
if (BR.input && BR.input.init) BR.input.init(canvas);
if (q.get('skin') && BR.skin) BR.skin.set(q.get('skin'));

BR.bus.on('game:start', p => {
  console.log('[test] game:start', JSON.stringify(p));
  document.title = 'game:start ' + p.mode + ' ' + (p.difficulty || '');
});
BR.bus.on('skin:change', p => console.log('[test] skin:change', p.key));

function clickAt(x, y) {
  const opt = { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerId: 1, pointerType: 'mouse', isPrimary: true };
  canvas.dispatchEvent(new PointerEvent('pointerdown', opt));
  canvas.dispatchEvent(new PointerEvent('pointerup', opt));
  canvas.dispatchEvent(new MouseEvent('click', opt));
}

BR.assets.init().then(() => {
  BR.home.init();
  BR.home.show();
  const open = q.get('open');
  if (!open) return;
  setTimeout(() => {
    if (open === 'skin') {
      // 走真实的点击拾取：把人物胸口投影到屏幕上点一下
      const v = new THREE.Vector3(0, 1.15, 0.1).project(BR.gfx.camera);
      clickAt((v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight);
      if (q.get('skin2')) setTimeout(() => document.querySelector('.home-swatch[data-key="' + q.get('skin2') + '"]').click(), 100);
      return;
    }
    if (open === 'credits') { document.querySelector('.home-credit').click(); return; }
    document.querySelector('.home-play').click();
    if (open !== 'menu') document.querySelector('.home-menu-btn.is-' + open).click();
    // ?click=选择器：再点一下弹窗里的控件（例如开始按钮），配合 --dump-dom 查看 game:start 载荷
    const sel = q.get('click');
    if (sel) setTimeout(() => {
      const el = document.querySelector(sel);
      if (el) el.click(); else console.error('[test] 找不到', sel);
      console.log('[test] 弹层', document.querySelector('.home-modal').hidden ? '已关闭' : '仍打开');
    }, 150);
  }, 300);
});

let last = performance.now();
(function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, (now - last) / 1000);
  last = now;
  BR.gfx.render(dt);
  if (BR.input && BR.input.endFrame) BR.input.endFrame();
})(last);
})();
</script>
