<!-- 音频模块自测页：逐个试听全部环境预设和单次音效；?selftest 时离线渲染所有预设并输出响度/报错（给无头浏览器跑） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后室 · 音频自测</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; background: #1b1a14; color: #eee3b0; margin: 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  h2 { font-size: 15px; margin: 18px 0 8px; color: #d9c56a; }
  button { min-height: 44px; min-width: 44px; margin: 3px; padding: 6px 12px; background: #3a3520; color: #f3e7b1; border: 1px solid #6b6036; border-radius: 6px; font-size: 14px; }
  button.on { background: #8a7a2e; color: #111; }
  label { display: block; margin: 8px 0; }
  label.inline { display: inline-block; margin: 0 0 0 12px; }
  input[type=range] { width: 260px; max-width: 60vw; vertical-align: middle; }
  input[type=number] { width: 56px; background: #111; color: #eee3b0; border: 1px solid #6b6036; border-radius: 4px; padding: 4px; }
  small { color: #a99d6c; }
  #state { margin-left: 8px; color: #a99d6c; }
  pre { white-space: pre-wrap; font-size: 12px; background: #111; padding: 8px; }
</style>
<div><button id="unlock">① 点这里解锁音频</button><span id="state">未解锁</span></div>
<small>切到别的标签页再回来：状态应显示 suspended → running，环境音接着放。</small>
<label>主音量 <input id="master" type="range" min="0" max="1" step="0.01" value="0.8"></label>
<label>san（1=正常） <input id="sanity" type="range" min="0" max="1" step="0.01" value="1"> <span id="sv">1.00</span>
  <small>0.85 以下开始变闷，0.6 以下开始出现低语 / 耳鸣，越低越多</small></label>
<label>play 音量 <input id="vol" type="range" min="0" max="2" step="0.05" value="1"> <span id="vv">1.00</span></label>
<label>play 速率 <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1"> <span id="rv">1.00</span></label>

<h2>环境音 setAmbient</h2>
<div id="amb"></div>
<div>
  <button id="ambSeq">依次试听全部环境</button>
  每个 <input id="ambSec" type="number" min="4" max="120" value="12"> 秒
  <label class="inline">交叉淡化 <input id="xf" type="number" min="0" max="10" step="0.5" value="2.5"> 秒</label>
</div>

<h2>单次音效 play（2D）</h2>
<div id="sfx"></div>
<div><button id="sfxSeq">依次试听全部音效</button> <button id="stop">停止依次试听</button></div>

<h2>3D：声源绕着听者转一圈（戴耳机）</h2>
<div id="d3"></div>

<h2>离线响度</h2>
<button id="loud">离线渲染全部，列出 RMS / 峰值</button>
<pre id="out"></pre>

<script src="../js/core/base.js"></script>
<script src="../js/core/audio.js"></script>
<script>
(function () {
  'use strict';
  const BR = window.BR;
  // 列表以模块导出的为准，这样新加的预设/音效自动出现；旧版没有导出时退回第 12 节的清单
  const AMB = (BR.audio && BR.audio.presets) || ['fluorescent', 'pipes', 'electrical', 'office-rain', 'hotel', 'dark', 'ocean', 'cave',
    'suburb-night', 'wind-field', 'city', 'party', 'chase', 'silence'];
  const SFX = (BR.audio && BR.audio.sounds) || ['step', 'step-wet', 'pickup', 'drink', 'eat', 'hurt', 'death', 'whisper', 'giggle', 'growl',
    'screech', 'door', 'noclip', 'heartbeat', 'buzz', 'static', 'click', 'hit', 'breath'];
  const out = document.getElementById('out');
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  if (location.search.indexOf('selftest') >= 0) { selftest(); return; }

  let curAmb = null;
  function ensure() {
    if (BR.audio.unlocked) return;
    BR.audio.unlock();
    BR.audio.setMaster(+$('master').value);
    BR.audio.setSanity(+$('sanity').value);
    $('unlock').textContent = '已解锁';
  }
  function mark(sel, name) {
    document.querySelectorAll(sel + ' button').forEach(x => x.classList.toggle('on', x.dataset.name === name));
  }
  function setAmb(name) {
    ensure();
    BR.audio.setAmbient(name, +$('xf').value);
    curAmb = name;
    mark('#amb', name);
  }
  function playOne(name, pos) {
    ensure();
    return BR.audio.play(name, pos, { volume: +$('vol').value, rate: +$('rate').value });
  }

  $('unlock').onclick = ensure;
  $('master').oninput = e => BR.audio.setMaster(+e.target.value);
  $('sanity').oninput = e => { BR.audio.setSanity(+e.target.value); $('sv').textContent = (+e.target.value).toFixed(2); };
  $('vol').oninput = e => { $('vv').textContent = (+e.target.value).toFixed(2); };
  $('rate').oninput = e => { $('rv').textContent = (+e.target.value).toFixed(2); };

  AMB.forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.dataset.name = name;
    b.onclick = () => { stopSeq(); setAmb(name); };
    $('amb').appendChild(b);
  });
  SFX.forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.dataset.name = name;
    b.onclick = () => { const h = playOne(name); out.textContent = name + (h ? '' : '（没发声：未解锁/被合并/发声数满）'); };
    $('sfx').appendChild(b);
  });

  // 依次试听：用序号作废旧序列，点"停止"或手动点按钮都会打断
  let seq = 0;
  function stopSeq() { seq++; mark('#sfx', null); }
  async function runSeq(list, fn, gapMs) {
    const my = ++seq;
    for (let i = 0; i < list.length; i++) {
      if (my !== seq) return;
      fn(list[i]);
      out.textContent = '依次试听 ' + (i + 1) + '/' + list.length + '：' + list[i];
      await wait(gapMs(list[i]));
    }
    if (my === seq) out.textContent += '\n依次试听结束';
  }
  const LONG = { death: 5000, noclip: 3500, whisper: 3000, growl: 2500, giggle: 2500, door: 2500, drink: 2500, eat: 2500, hurt: 2000, breath: 3000 };
  $('sfxSeq').onclick = () => {
    ensure();
    runSeq(SFX, name => { mark('#sfx', name); playOne(name); }, name => (LONG[name] || 1600) / Math.max(0.5, +$('rate').value));
  };
  $('ambSeq').onclick = () => {
    ensure();
    runSeq(AMB, setAmb, () => Math.max(4, +$('ambSec').value) * 1000);
  };
  $('stop').onclick = stopSeq;

  ['growl', 'whisper', 'step', 'giggle', 'screech'].forEach(name => {
    const b = document.createElement('button');
    b.textContent = name + ' 绕圈';
    b.onclick = () => {
      ensure();
      BR.audio.setListener(0, 1.62, 0, 0);
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          const a = i / 8 * Math.PI * 2;
          playOne(name, { x: Math.sin(a) * 4, y: 1.5, z: -Math.cos(a) * 4 });
          out.textContent = '声源方位 ' + Math.round(a * 180 / Math.PI) + '°（0=正前方，顺时针）';
        }, i * 900);
      }
    };
    $('d3').appendChild(b);
  });

  $('loud').onclick = async () => {
    const b = $('loud');
    b.disabled = true;
    const rows = [];
    const add = (label, r) => {
      rows.push(r.error ? label + '  出错 ' + r.error
        : label.padEnd(22) + ' RMS ' + String(r.rmsDb).padStart(6) + ' dB   峰值 ' + String(r.peakDb).padStart(6) + ' dB' + (r.nan ? '   NaN×' + r.nan : ''));
      out.textContent = rows.join('\n');
    };
    const run = async (kind, name, sec) => {
      try { return await BR.audio._renderOffline(kind, name, sec); } catch (e) { return { error: String(e && e.message || e) }; }
    };
    for (const name of AMB) add('环境 ' + name, await run('ambient', name, 15));
    for (const name of SFX) add('音效 ' + name, await run('sfx', name, 5));
    add('幻听 san=0', await run('hallu', 'sanity0', 30));
    add('幻听 san=0.3', await run('hallu', 'sanity0.3', 30));
    b.disabled = false;
  };

  setInterval(() => {
    const c = BR.audio.ctx;
    $('state').textContent = c ? c.state + ' · ' + c.sampleRate + ' Hz · 环境 ' + (curAmb || '—') : '未解锁';
  }, 300);

  async function selftest() {
    const res = { ambient: {}, sfx: {}, errors: [] };
    const origErr = console.error, origWarn = console.warn;
    console.error = function () { res.errors.push('E ' + [].join.call(arguments, ' ')); origErr.apply(console, arguments); };
    console.warn = function () { res.errors.push('W ' + [].join.call(arguments, ' ')); origWarn.apply(console, arguments); };
    for (const name of AMB) {
      try { res.ambient[name] = await BR.audio._renderOffline('ambient', name, 20); }
      catch (e) { res.ambient[name] = { error: String(e && e.stack || e) }; }
    }
    for (const name of SFX) {
      try { res.sfx[name] = await BR.audio._renderOffline('sfx', name, 5); }
      catch (e) { res.sfx[name] = { error: String(e && e.stack || e) }; }
    }
    try { res.hallu = await BR.audio._renderOffline('hallu', 'sanity0', 40); }
    catch (e) { res.hallu = { error: String(e && e.stack || e) }; }
    out.textContent = 'SELFTEST' + JSON.stringify(res) + 'END';
    document.title = 'done';
  }
})();
</script>
